/* ---------- les moments de l'histoire ----------
   Un moment = quelqu'un arrive ou demande quelque chose, en quelques étapes.
   Chaque étape : ce qu'on se dit (dit), ce qui se passe (debut), puis ce qu'il faut faire (buts).
   Un but : [ce qu'on lit, combien on en a, combien il en faut, l'aide, (où regarder)].
   kind 'envie' : c'est l'envie de quelqu'un (un cœur chez lui, +1 bonheur à la fin).
   kind 'moment' : un grand moment (une arrivée, une tempête…). */
const B = (w, t, p) => ({w, t, p});
const quaisIlot = () => { let n = 0; for (let i = 0; i < N*N; i++) if (G[i] === 'q' && inIsle(i, 'ilot')) n++; return n; };
const quaisMain = () => { let n = 0; for (let i = 0; i < N*N; i++) if (G[i] === 'q' && !isleOf(i)) n++; return n; };
const firstOf = id => { const cx = (camX + vw()/2)/T, cy = (camY + vh()/2)/T; let best = null, bd = 1e9; for (let i = 0; i < N*N; i++){ if (O[i] !== id || fogAt(i % N, (i / N)|0)) continue; const d = Math.hypot(i % N - cx, ((i / N)|0) - cy); if (d < bd){ bd = d; best = i; } } return best; };
function nearId(id, at, r){ for (let i = 0; i < N*N; i++) if (O[i] === id && cheb(i, at) <= r) return true; return false; }
/* le pont jusqu'à une île : une case de cette île est reliée à ton île */
function pontVers(key){ const land = mainLandSet(); for (let i = 0; i < N*N; i++) if (land[i] && inIsle(i, key) && G[i] !== 'n') return true; return false; }
/* un chemin continu qui touche plusieurs maisons */
function maisonsReliees(ws){
  const hs0 = ws.map(w => Object.entries(S.homes).find(([k, v]) => v === w && O[+k] === 'h')).filter(Boolean).map(([k]) => +k);
  if (hs0.length < ws.length) return hs0.length ? 1 : 0;
  const start = [1, -1, N, -N].map(d => hs0[0] + d).filter(j => walkable(G[j]));
  const seen = new Set(start), q = [...start];
  while (q.length){ const i = q.pop(); for (const d of [1, -1, N, -N]){ const j = i + d; if (j < 0 || j >= N*N || seen.has(j) || !walkable(G[j]) || G[j] === 'q') continue; seen.add(j); q.push(j); } }
  return 1 + hs0.slice(1).filter(h => [1, -1, N, -N].some(d => seen.has(h + d))).length;
}
/* l'îlot de Tomas : sa cabane, son potager, son petit quai, un casier */
function setupIlot(){
  if (S.ilotPret) return; S.ilotPret = 1;
  const g = S.isles.ilot, P = CARTE.principale, cells = [];
  for (let i = 0; i < N*N; i++) if (inIsle(i, 'ilot') && G[i] !== 'w') cells.push(i);
  const cab = cells.filter(i => G[i] !== 's').sort((a, b) => dist2(a, Math.round(g.cy)*N + Math.round(g.cx)) - dist2(b, Math.round(g.cy)*N + Math.round(g.cx)))[0];
  O[cab] = 'Ĉ'; S.homes[cab] = 'tomas';
  const v = cells.find(i => i !== cab && cheb(i, cab) === 1 && !O[i]); if (v != null) O[v] = 'V';
  // le quai, du côté de ton île
  const toward = Math.round(P.cy)*N + Math.round(P.cx);
  const edge = cells.filter(i => near4(i, j => G[j] === 'w')).sort((a, b) => dist2(a, toward) - dist2(b, toward))[0];
  S.quaiTomas = [];
  if (edge != null){ let cur = edge; for (let k = 0; k < 2; k++){ const nx = [1, -1, N, -N].map(d => cur + d).filter(j => G[j] === 'w').sort((a, b) => dist2(a, toward) - dist2(b, toward))[0]; if (nx == null) break; G[nx] = 'q'; S.quaiTomas.push(nx); cur = nx; }
    const last = S.quaiTomas[S.quaiTomas.length - 1]; const cas = last != null && [1, -1, N, -N].map(d => last + d).find(j => G[j] === 'w' && !O[j]); if (cas) O[cas] = 'N'; }
  for (const i of cells) if (O[i] === 'r' && cheb(i, cab) <= 2) O[i] = null;
  groundDirty = true; save(); syncWalkers();
}

/* à la souris (sur ordinateur) : la molette et le cliquer-glisser font défiler les rangées, comme le doigt sur téléphone */

  el.addEventListener('wheel', e => { if (el.scrollWidth <= el.clientWidth + 2) return; const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (!d) return; el.scrollLeft += d; e.preventDefault(); }, {passive:false});
  let x0 = null, l0 = 0, bouge = false;
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0) return; x0 = e.clientX; l0 = el.scrollLeft; bouge = false; });
  addEventListener('pointermove', e => { if (x0 == null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 5) bouge = true; if (bouge){ el.scrollLeft = l0 - dx; el.style.cursor = 'grabbing'; } });
  addEventListener('pointerup', () => { if (x0 == null) return; x0 = null; el.style.cursor = ''; if (bouge) setTimeout(() => bouge = false, 0); });
  el.addEventListener('click', e => { if (bouge){ e.stopPropagation(); e.preventDefault(); bouge = false; } }, true);   // un glissé n'est pas un clic
}

  const close = () => { cancelAnimationFrame(tutoRaf); onresize_tuto = null; if (done) done(); el.classList.add('part'); setTimeout(() => { el.hidden = true; el.classList.remove('part'); }, 600); };
  next.onclick = () => {
    if (PG[k].carnet){ const v = tutoNom.value.trim(); if (!v){ tutoNom.focus(); tutoNom.classList.remove('secoue'); void tutoNom.offsetWidth; tutoNom.classList.add('secoue'); return; } S.nom = v; save(); }
    if (k < PG.length - 1){ k++; show(); } else if (still || landing) close(); else { landing = true; next.disabled = true; setTimeout(() => { next.disabled = false; close(); }, 1400); } };
  skip.onclick = () => { const c = PG.findIndex(pg => pg.carnet); if (c >= 0 && !S.nom){ k = c; show(); return; } close(); };   // on ne saute pas le prénom
  back.onclick = () => { if (k > 0){ k--; show(); } };
  landing = false; next.disabled = false; t0 = performance.now(); el.hidden = false; fit(); bx = target(); show(); cancelAnimationFrame(tutoRaf); tutoRaf = requestAnimationFrame(frame);
  onresize_tuto = () => { if (!el.hidden){ const f = bx - target(); fit(); bx = target() + f; } };
}
/* ---------- le démarrage : la page d'accueil, puis l'île ---------- */
function askName(done){
  sayQ = {lines:[], k:0}; const bu = $('bulle'); bu.classList.remove('mot'); bu.classList.add('liste');
  showBulle('carnet', {t:'Sur la couverture de ton carnet de bord, écris ton **prénom**. Et dessine-toi, juste en dessous !'}, {});
  const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 18; inp.placeholder = 'Ton prénom'; inp.autocomplete = 'off'; inp.className = 'nom';
  $('bExtra').innerHTML = ''; $('bExtra').append(inp, lookPicker(), $('bGo')); $('bGo').classList.add('fin'); $('bGo').textContent = 'C’est parti'; $('bGo').hidden = false;
  const go = () => { const v = inp.value.trim(); if (!v){ inp.focus(); return; } S.nom = v; sayQ = null; $('bExtra').innerHTML = ''; hideBulle(); bu.classList.remove('liste'); done(); };
  $('bGo').onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => inp.focus(), 80);
}
/* l'accueil : le titre, l'île au loin dans la brume, un bouton */
function accueil(texte, sous, go){
  document.body.classList.add('a-l-accueil');
  $('acGo').textContent = texte; $('acSous').textContent = sous || ''; $('accueil').hidden = false;
  $('acGo').onclick = () => { $('accueil').classList.add('part'); document.body.classList.remove('a-l-accueil'); setTimeout(() => { $('accueil').hidden = true; $('accueil').classList.remove('part'); }, 500); go(); };
}
function vueLarge(){ const P = CARTE.principale; zoom = Math.max(zoomMin(), Math.min(zoomMax(), board.width / (30*T))); lookAt(P.cx, P.cy - 2); }
function vueProche(cx, cy){ const z0 = zoom, z1 = Math.max(zoomMin(), Math.min(zoomMax(), (window.devicePixelRatio || 1) * 3.2)), t0 = performance.now();
  const step = () => { const k = Math.min(1, (performance.now() - t0) / 1200), e = k*k*(3 - 2*k); zoom = z0 + (z1 - z0)*e; lookAt(cx, cy); if (k < 1) requestAnimationFrame(step); }; step(); }
function newGame(){
  S = newState(); makeWorld(); startFog(); tday = 0.3; vueLarge();
  accueil('Commencer', '', () => showTraversee(accoster));
}
/* on accoste : la brume se lève sur la plage, ton personnage saute de la barque */
function accoster(){
  const f = S.fogs.find(x => x.key === 'start'); vueProche(f.cx, f.cy + 1); tday = 0.36;
  for (const x of S.fogs) if (x.key === 'arrivee'){ x.to = 0; x.sp = 0.5; }
  save();
  setTimeout(() => { player = playerSpawn(); forceDraw = true; }, 2300);
  setTimeout(() => sayList([B('carnet', 'Au petit matin, ta barque racle le sable d’une **île déserte**. Autour, la brume cache encore tout le reste.')], () => (S.nom ? (f => f()) : askName)(() => {
    S.started = true; save(); renderCard(true); renderBar(); renderRes(); setTimeout(momentTick, 300);
  })), 2600);
}
function boot(){
  resize();
  if (load() && S.started){
    villRegister(); sansBouee(); if (unlocked('c')){ if (!unlocked('g')) unlock('g', true); if (!unlocked('s')) unlock('s', true); } appliqueMeteo(); if (S.saison && SEASONS[S.saison]){ season = S.saison; PAL = SEASONS[season]; } gVer++; groundDirty = true; syncWalkers();
    vueLarge(); renderBar(); renderCard(true); renderRes();
    accueil('Continuer', `${tierName()} de ${S.nom} · ☀️ ${bonheur()}`, () => {
      const h = homeOf('toi') ?? homeOf('toi_c') ?? S.barque ?? 0, [x, y] = xy(h); vueProche(x, y);
      if (S.moment && !S.moment.read) setTimeout(startEtape, 1300);
    });
  } else newGame();
  renderBar(); requestAnimationFrame(frame);
}
addEventListener('pagehide', saveNow); document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
boot();
