<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>verso</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="verso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Libre+Caslon+Text:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Une seule page sans défilement : le frigo prend la place libre, le tiroir est fixé en bas. Le carnet est une page à part. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#1d2422; --muted:#5b6763; --line:#d3dcd8;
  --door:#cfe3db; --door-edge:#b4cec4; --door-shine:rgba(255,255,255,.55);
  --magnet:#fdfdfb; --magnet-ink:#161616; --accent:#1f6f68; --accent-soft:#d6ebe7;
  --f-title:"Young Serif", Georgia, serif;
  --f-magnet:"Libre Caslon Text", "Times New Roman", serif;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2422; --ink:#e7eeeb; --muted:#9aa7a2; --line:#2e3835;
  --door:#2b3a36; --door-edge:#223029; --door-shine:rgba(255,255,255,.05);
  --magnet:#f4f2ec; --magnet-ink:#161616; --accent:#7cc4b9; --accent-soft:#21403b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2422; --ink:#e7eeeb; --muted:#9aa7a2; --line:#2e3835;
  --door:#2b3a36; --door-edge:#223029; --door-shine:rgba(255,255,255,.05);
  --magnet:#f4f2ec; --magnet-ink:#161616; --accent:#7cc4b9; --accent-soft:#21403b; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b));max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
h1{font-family:var(--f-title);font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em;line-height:1}
.hbtns{display:flex;gap:8px}
.icon{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.icon .n{font-weight:400;color:var(--muted)}

/* ----- bandeau défi ----- */
.challenge{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;min-height:46px}
.challenge .text{margin:0;flex:1;min-width:0;font-family:var(--f-magnet);font-style:italic;font-size:14.5px;line-height:1.3;color:var(--muted);text-align:left;border:none;background:none;padding:0}
.challenge .text b{font-family:var(--f-ui);font-style:normal;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.challenge .acts{display:flex;gap:2px;flex:none}
.challenge .link{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:8px 7px;text-decoration:underline}
.challenge .go{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.challenge.propose{border-style:dashed;border-color:var(--accent);flex-wrap:wrap;row-gap:2px}
.challenge.propose .text{flex-basis:100%;padding-top:4px}
.challenge.propose .acts{margin-left:auto}
.challenge.propose .text{color:var(--ink);cursor:pointer}
.challenge.propose .go{background:var(--accent);color:var(--surface)}
.challenge.defi{background:var(--accent-soft);border-color:var(--accent)}
.challenge.defi .text{color:var(--ink)}

/* ----- frigo + tiroir ----- */
.app{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.door{position:relative;flex:1;min-height:0;border-radius:16px;background:
  linear-gradient(115deg,var(--door-shine) 0%,transparent 28%,transparent 70%,var(--door-shine) 100%),var(--door);
  box-shadow:inset 0 0 0 1px var(--door-edge),inset -9px 0 0 var(--door-edge),0 8px 22px rgba(20,40,35,.14);overflow:hidden;touch-action:none}
.door.over{box-shadow:inset 0 0 0 2px var(--accent),inset -9px 0 0 var(--door-edge)}
.handle{position:absolute;right:20px;top:12%;width:7px;height:22%;border-radius:6px;background:var(--door-edge)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-family:var(--f-magnet);font-style:italic;font-size:14px;padding:24px 40px;pointer-events:none}

.mag{position:absolute;font-family:var(--f-magnet);font-size:17px;line-height:1;color:var(--magnet-ink);background:var(--magnet);padding:7px 9px 6px;border-radius:1px;
  box-shadow:0 1px 0 rgba(0,0,0,.12),1px 2px 3px rgba(0,0,0,.18);white-space:nowrap;cursor:grab;touch-action:none;transform:rotate(var(--r,0deg))}
.door .mag.morph{box-shadow:0 1px 0 rgba(0,0,0,.12),1px 2px 3px rgba(0,0,0,.18),inset 0 -2px 0 var(--accent-soft)}
.mag.drag{position:fixed;z-index:50;cursor:grabbing;box-shadow:0 2px 0 rgba(0,0,0,.1),3px 8px 16px rgba(0,0,0,.28);transform:rotate(var(--r,0deg)) scale(1.1)}
.mag.fresh{animation:pop .25s ease-out}
@keyframes pop{from{transform:rotate(var(--r,0deg)) scale(.7);opacity:.4}}

.side{flex:none;height:min(44dvh,380px);min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.side.over{outline:2px dashed var(--accent);outline-offset:-2px}
.pools{flex:none;display:flex;gap:6px;overflow-x:auto;padding:10px 10px 6px;scrollbar-width:none;touch-action:pan-x}
.pools::-webkit-scrollbar{display:none}
.pools button{flex:none;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pools .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{flex:1;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:8px 2px 7px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.drawer{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:9px 7px;align-content:flex-start;padding:12px 10px;touch-action:pan-y}
.drawer .mag{position:relative;touch-action:pan-y}
.glabel{flex-basis:100%;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.glabel:first-child{margin-top:0}
.drawer .mag.drag{position:fixed}
.bar{flex:none;display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.btn{flex:1;font:inherit;font-size:14px;padding:8px 6px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}

@media (min-width:880px){
  .shell{padding:20px 20px 20px}
  .app{flex-direction:row}
  .side{height:auto;width:42%}
  h1{font-size:36px}
}

/* ----- carnet : les textes à la suite, le plus récent en haut ----- */
.page{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:fade .22s ease-out}
.page header{padding:calc(10px + var(--safe-t)) 16px 8px;max-width:680px;width:100%;margin:0 auto;flex:none}
.page h2{font-family:var(--f-title);font-weight:400;font-size:28px;margin:0}
.search{flex:none;max-width:680px;width:100%;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:10px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search .found{color:var(--muted);font-size:13px;flex:none}
.page .scroll{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.poems{max-width:680px;margin:0 auto;padding:0 16px calc(24px + var(--safe-b))}
.entry{padding:18px 0 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:none}
.entry .defi{font-family:var(--f-magnet);font-style:italic;font-size:13.5px;line-height:1.35;color:var(--accent);margin-bottom:8px}
.entry .defi::before{content:"Défi · ";font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.entry pre{margin:0;font-family:var(--f-magnet);font-size:19px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--ink);-webkit-user-select:text;user-select:text}
.entry mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.entry .meta{display:flex;align-items:center;gap:4px;margin-top:8px;color:var(--muted);font-size:12.5px}
.entry .meta .d{flex:1}
.entry .meta button{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px}
.entry .meta button.del.sure{background:#b3473a;color:#fff;font-weight:700}
.blank{color:var(--muted);text-align:center;padding:60px 20px;font-family:var(--f-magnet);font-style:italic}

/* ----- après « Garder » : un petit mot doux sur le frigo ----- */
.saved{position:absolute;left:10px;right:18px;bottom:10px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 22px rgba(20,40,35,.16);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;animation:rise .3s ease-out}
.saved p{margin:0;flex:1 1 150px;font-size:14px;line-height:1.3}
.saved p b{display:block;font-size:14.5px}
.saved p span{color:var(--muted);font-size:12.5px}
.saved .acts{display:flex;gap:6px;margin-left:auto}
.saved button{font:inherit;font-size:13.5px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.saved button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
.door.kept{animation:kept .7s ease-out}
@keyframes kept{30%{filter:brightness(1.08)}}

/* ----- menu ----- */
.menu{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,30,27,.32);backdrop-filter:blur(2px);animation:fade .25s ease-out}
.menu .card{animation:rise .3s ease-out}
.menu .card{width:100%;max-width:400px;background:var(--surface);border-radius:18px;padding:22px 18px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.menu h2{font-family:var(--f-title);font-weight:400;font-size:25px;margin:0}
.menu .sub{margin:0 0 2px;color:var(--muted);font-size:14px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.choice .em{font-size:28px;flex:none}
.choice b{display:block;font-size:16px}
.choice span.d{display:block;font-size:13px;color:var(--muted)}
.menu .stay{align-self:center;border:none;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}

.toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:80;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.mag.fresh,.page,.sheet,.saved,.menu,.menu .card,.door.kept{animation:none!important}.toast{transition:none}}
</style></head><body>

<div class="shell">
  <header>
    <h1>verso</h1>
    <div class="hbtns">
      <button class="icon" id="newBtn" type="button">✨ Nouveau</button>
      <button class="icon" id="carnetBtn" type="button">📓 <span class="n" id="carnetCount"></span></button>
    </div>
  </header>

  <div class="challenge" id="challenge" aria-live="polite"></div>

  <div class="app">
    <div class="door" id="door" aria-label="Porte du frigo où composer ton poème">
      <div class="handle"></div>
      <div class="saved" id="saved" hidden role="status">
        <p><b id="savedTitle">Gardé dans ton carnet 📓</b></p>
        <div class="acts"><button type="button" id="savedRead">Le relire</button><button type="button" class="primary" id="savedNew">Nouveau poème</button></div>
      </div>
      <div class="empty" id="emptyMsg">Touche un mot du tiroir pour le poser ici.<br>Touche-le sur le frigo pour le conjuguer ou l'accorder, glisse-le vers le tiroir pour l'enlever.</div>
    </div>

    <div class="side" id="side">
      <div class="pools" id="pools"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="drawer" id="drawer"></div>
      <div class="bar">
        <button class="btn" id="shuffle" type="button">🎁 Sachet</button>
        <button class="btn" id="clearDoor" type="button">Tout ranger</button>
        <button class="btn primary" id="keep" type="button">Garder ✓</button>
      </div>
    </div>
  </div>
</div>

<section class="page" id="carnetPage" hidden aria-label="Mon carnet">
  <header>
    <h2>Carnet</h2>
    <button class="icon" id="carnetBack" type="button">← Frigo</button>
  </header>
  <div class="search">
    <input id="q" type="search" placeholder="Chercher un mot…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Chercher dans mes poèmes">
    <span class="found" id="found"></span>
  </div>
  <div class="scroll"><div class="poems" id="poems"></div></div>
</section>

<div class="menu" id="menu" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <h2 id="menuTitle">Qu'est-ce qui te tente ?</h2>
    <p class="sub" id="menuSub"></p>
    <button class="choice" id="pickFree" type="button"><span class="em">✍️</span><span><b>Écrire librement</b><span class="d">Juste toi et les mots, sans consigne.</span></span></button>
    <button class="choice" id="pickStart" type="button"><span class="em">🌱</span><span><b>Une phrase pour commencer</b><span class="d">Quelques mots déjà posés, à toi de continuer.</span></span></button>
    <button class="choice" id="pickDefi" type="button"><span class="em">🎲</span><span><b>Relever un défi</b><span class="d">On t'en propose un, tu pioches jusqu'à ce qu'il te plaise.</span></span></button>
    <button class="stay" id="menuStay" type="button"></button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= les mots ================= */
const uniq = a => [...new Set(a)];
/* l'onglet Liens, rangé en petits groupes */
const LIEN_GROUPS = [
  ["Pour commencer", "le la les l' un une des de du d' au aux ce cet cette ces mon ma mes ton ta tes son sa ses notre nos votre leur"],

const LIENS = LIEN_GROUPS.flatMap(g => g[1]);
const PONCT = [",","?","!","…","."];
LIEN_GROUPS.push(["Ponctuation", PONCT]);
const COMMON_VERBS = ["être","avoir","aller","faire","voir","aimer","écrire","dire","savoir","pouvoir","vouloir","prendre","venir","sentir","vivre","mettre","devenir","tenir","lire","rester","penser","regarder","parler","donner","chercher","trouver"];

          "coudre broder caresser bercer chuchoter respirer flotter envelopper dormir écouter tricoter câliner fondre sourire embrasser garder consoler réchauffer toucher rêver",
          "doux tendre léger tiède moelleux fin rose calme chaud soyeux paisible délicat sucré lent petit mignon rond clair"),

          "gris lointain mouillé seul vide fragile lent froissé perdu pâle triste vieux usé fané éteint muet lourd las ancien"),
  joyeux: L("soleil rire fête terrasse café vélo confetti ballon danse chanson musique matin dimanche glace pique-nique bulle guirlande ami foule néon kiosque jour manège bonbon cadeau gâteau étincelle piscine plage pirouette tambour trompette balançoire",
          "danser chanter rire sourire courir sauter briller voler jouer marcher fêter crier applaudir tourner pétiller rigoler grimper siffler partager",
          "joyeux heureux vif pétillant sucré jaune éclatant fou bruyant allumé gai drôle léger rapide fier libre radieux orange génial"),
  myst: L("secret minuit lune étoile clé porte miroir labyrinthe forêt chouette masque énigme songe ombre brouillard lanterne phare horizon murmure lumière cœur grotte trésor carte boussole fantôme sorcière potion serrure grenier couloir escalier reflet cape loup corbeau légende",

          "secret mystérieux sombre étrange invisible profond ancien silencieux noir caché oublié magique bizarre lunaire étoilé interdit obscur nocturne"),
  printemps: L("fleur bourgeon jardin pétale cerisier herbe oiseau nid averse avril abeille lilas pluie matin graine papillon mai tulipe muguet coccinelle rosée prairie arrosoir pommier source ruisseau colline brin",

  ete: L("mer vague sel sable plage soleil écume galet mouette île bateau voile coquillage glace sieste juillet cigale horizon embrun marée houle rivage port août chapeau maillot serviette pastèque lavande crème dune falaise baignade palmier vacances chaleur",

const SECOND = ["fleurir","grandir","rougir","blanchir","applaudir","pâlir","vieillir","verdir","ralentir","jaunir","finir","choisir"];
function verbForms(inf){
  let f = IRR[inf];
  if (!f && SECOND.includes(inf)){ const st = inf.slice(0, -2); f = [inf, st+"is", st+"is", st+"it", st+"issons", st+"issez", st+"issent", st+"issait", st+"i", inf+"a"]; }
  if (!f){
    const st = inf.slice(0, -2);
    const soft = st.endsWith("g") ? st + "e" : st.endsWith("c") ? st.slice(0, -1) + "ç" : st;
    f = [inf, st+"e", st+"es", st+"e", soft+"ons", st+"ez", st+"ent", soft+"ait", st+"é", inf+"a"];
  }
  return merge(f, VLAB);
}
const AIRR = {
  "doux":["doux","douce","doux","douces"], "roux":["roux","rousse","roux","rousses"], "blanc":["blanc","blanche","blancs","blanches"],
  "secret":["secret","secrète","secrets","secrètes"], "frais":["frais","fraîche","frais","fraîches"],
  "nouveau":["nouveau","nouvelle","nouveaux","nouvelles"], "fou":["fou","folle","fous","folles"],
  "vieux":["vieux","vieille","vieux","vieilles"], "muet":["muet","muette","muets","muettes"], "las":["las","lasse","las","lasses"],
  "mignon":["mignon","mignonne","mignons","mignonnes"], "génial":["génial","géniale","géniaux","géniales"], "sec":["sec","sèche","secs","sèches"],
};
function adjForms(a){
  let f = AIRR[a];
  if (!f){
    if (a.endsWith("e")) f = [a, a, a+"s", a+"s"];
    else if (a.endsWith("eux")){ const st = a.slice(0, -1); f = [a, st+"se", a, st+"ses"]; }
    else if (a.endsWith("f")){ const st = a.slice(0, -1); f = [a, st+"ve", a+"s", st+"ves"]; }
    else if (a.endsWith("er")){ const st = a.slice(0, -2); f = [a, st+"ère", a+"s", st+"ères"]; }
    else if (/(el|ien)$/.test(a)){ const c = a.slice(-1); f = [a, a+c+"e", a+"s", a+c+"es"]; }
    else if (/[sx]$/.test(a)) f = [a, a+"e", a, a+"es"];
    else f = [a, a+"e", a+"s", a+"es"];
  }
  return merge(f, ["masculin","féminin","masc. pluriel","fém. pluriel"]);
}
function nounForms(n){
  const pl = /[sxz]$/.test(n) ? n : /(eau|au|eu)$/.test(n) || ["bijou","caillou","chou","genou","hibou","joujou","pou"].includes(n) ? n + "x" : n + "s";
  return merge([n, pl], ["singulier","pluriel"]);
}
function merge(words, labels){
  const out = [];
  words.forEach((w, i) => { const o = out.find(x => x.w === w); if (o) o.lab += " · " + labels[i]; else out.push({w, lab:labels[i]}); });
  return out;
}
function formsOf(m){
  if (m.c === "verbe") return verbForms(m.l);
  if (m.c === "adj") return adjForms(m.l);
  if (m.c === "nom") return nounForms(m.l);
  return null;
}

/* retrouve chaque mot du tiroir (et sa forme conjuguée ou accordée) */
const FORMS = new Map();
function indexForms(){
  const add = (w, c, l, f) => { if (!FORMS.has(w)) FORMS.set(w, {c, l, f}); };
  [...LIENS, ...PONCT].forEach(w => add(w, "lien", w, 0));
  ALL.noms.forEach(n => nounForms(n).forEach((x, f) => add(x.w, "nom", n, f)));
  uniq([...ALL.verbes, ...COMMON_VERBS]).forEach(v => verbForms(v).forEach((x, f) => add(x.w, "verbe", v, f)));
  ALL.adjs.forEach(a => adjForms(a).forEach((x, f) => add(x.w, "adj", a, f)));
}
function starterLines(text){
  if (!FORMS.size) indexForms();
  return text.split("/").map(line => line.trim().split(/\s+/).filter(Boolean).map(w => {
    const k = FORMS.get(w); return k ? [w, k.c, k.l, k.f] : [w, "lien", w, 0];
  }));
}
function putStarter(text){
  const lines = starterLines(text), dw = door.getBoundingClientRect().width || 340, dh = door.getBoundingClientRect().height || 400;
  const lh = 46 / dh * 100;
  lines.forEach((line, li) => {
    let x = [7, 13, 18, 10][li % 4];
    for (const [w, c, l, f] of line){
      const m = mk(w, c, {l, f, on:true, x, y: 8 + li*lh + rnd(-0.6, 0.6)});
      words.push(m); x += measure(w) / dw * 100 + 1.8;
    }
  });
}
function sample(){
  pool = "tout";

}
function guessCat(w){
  if (ALL.noms.includes(w)) return "nom";
  if (ALL.verbes.includes(w) || COMMON_VERBS.includes(w)) return "verbe";
  if (ALL.adjs.includes(w)) return "adj";
  return "lien";
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({v:5, pool, tab, words, carnet, mode, challenge, recent})); } catch(e){} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d && Array.isArray(d.words)){
      pool = LEX[d.pool] ? d.pool : "tout";
      tab = ["nom","verbe","adj","lien"].includes(d.tab) ? d.tab : "nom";
      words = d.words.map(m => m.c ? m : {...m, c: guessCat(m.w), l: m.w, f: 0});
      carnet = d.carnet || [];
      mode = ["libre","propose","defi"].includes(d.mode) ? d.mode : "libre";
      challenge = typeof d.challenge === "string" ? d.challenge : null;
      recent = Array.isArray(d.recent) ? d.recent : [];
      if (mode !== "libre" && !challenge) mode = "libre";
      uid = Math.max(0, ...words.map(m => m.id)) + 1;
      if (d.v !== 5) freshDrawer();

}

/* ================= glisser-déposer ================= */
let drag = null;
function startDrag(e){
  if (e.button > 0 || drag) return;
  if (!savedEl.hidden) hideSaved();
  const el = e.currentTarget, m = words.find(w => w.id === +el.dataset.id);
  const r = el.getBoundingClientRect();
  drag = {m, el, sx:e.clientX, sy:e.clientY, ox:e.clientX - r.left, oy:e.clientY - r.top, moved:false, w:r.width, h:r.height, fromDrawer: !m.on, st: drawer.scrollTop};
  el.setPointerCapture(e.pointerId);
  el.addEventListener("pointermove", moveDrag);
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  if (m.on) e.preventDefault();
}
function inside(rect, x, y){ return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom; }
function moveDrag(e){
  if (!drag) return;
  const d = drag;
  if (!d.moved){
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.hypot(dx, dy) < 7) return;
    d.moved = true;
    d.el.classList.add("drag");
    d.el.style.width = d.w + "px";
  }
  d.el.style.left = (e.clientX - d.ox) + "px";
  d.el.style.top = (e.clientY - d.oy) + "px";
  door.classList.toggle("over", inside(door.getBoundingClientRect(), e.clientX, e.clientY));
  side.classList.toggle("over", d.m.on && inside(side.getBoundingClientRect(), e.clientX, e.clientY));
}
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  d.el.removeEventListener("pointermove", moveDrag);
  d.el.removeEventListener("pointerup", endDrag);
  d.el.removeEventListener("pointercancel", endDrag);
  door.classList.remove("over"); side.classList.remove("over");
  if (e.type === "pointercancel"){ render(); return; }
  if (!d.moved){
    if (d.m.on){ morph(d.m); return; }
    const c = copyOf(d.m); placeFree(c); render(c.id); save(); return;
  }
  const dr = door.getBoundingClientRect();
  if (inside(dr, e.clientX, e.clientY)){
    const left = e.clientX - d.ox - dr.left, top = e.clientY - d.oy - dr.top;
    const m = d.m.on ? d.m : copyOf(d.m);
    m.on = true;
    m.x = clamp(left / dr.width * 100, 0, 100 - d.w / dr.width * 100);
    m.y = clamp(top / dr.height * 100, 0, 100 - d.h / dr.height * 100);
    words = [...words.filter(w => w !== m), m];
  } else if (d.m.on && inside(side.getBoundingClientRect(), e.clientX, e.clientY)){
    words = words.filter(w => w !== d.m);
  }
  render(); save();
  drawer.scrollTop = d.st;
}
function copyOf(m){ const c = mk(m.w, m.c, {l:m.l, f:m.f}); words.push(c); return c; }
function morph(m){
  const forms = formsOf(m);
  if (!forms || forms.length < 2){ toast("Ce mot-là ne change pas"); return; }
  m.f = (m.f + 1) % forms.length; m.w = forms[m.f].w;
  render(m.id); save(); toast(forms[m.f].lab);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function placeFree(m){
  const on = words.filter(w => w.on && w !== m);
  const dr = door.getBoundingClientRect();
  const lh = 44 / dr.height * 100;   // hauteur d'une ligne
  let x = 6, y = 6;
  if (on.length){
    const lastLineY = Math.max(...on.map(w => w.y));
    const line = on.filter(w => Math.abs(w.y - lastLineY) < lh / 2);
    const right = Math.max(...line.map(w => w.x + measure(w.w) / dr.width * 100));
    x = right + 1.5; y = lastLineY;
    if (x + measure(m.w) / dr.width * 100 > 90){ x = 6; y = lastLineY + lh; }
    if (y > 100 - lh){ y = rnd(8, 80); x = rnd(6, 55); }
  }
  m.on = true; m.x = x + rnd(-0.5, 0.5); m.y = y + rnd(-0.6, 0.6);
  words = [...words.filter(w => w !== m), m];
}
const meas = document.createElement("div"); meas.className = "mag"; meas.style.visibility = "hidden"; meas.style.left = "-999px";
document.body.append(meas);
function measure(w){ meas.textContent = w; return meas.getBoundingClientRect().width; }

/* ================= lecture du poème ================= */
function poemText(list){
  const on = list.filter(m => m.on !== false).sort((a, b) => a.y - b.y);
  const lines = [];
  for (const m of on){ const l = lines.find(l => Math.abs(l.y - m.y) < 4); if (l) l.items.push(m); else lines.push({y:m.y, items:[m]}); }
  return lines.map(l => {
    let s = "";
    for (const m of l.items.sort((a, b) => a.x - b.x)){
      const w = m.w;
      if (w.startsWith("-") && w.length > 1) s += w.slice(1);
      else if (w === "," || w === "…" || w === ".") s += w;
      else if (w === "?" || w === "!") s += " " + w;
      else if (s.endsWith("'") || !s) s += w;
      else s += " " + w;
    }
    return s;
  }).join("\n");
}

/* ================= carnet : les textes à la suite ================= */
const carnetPage = document.getElementById("carnetPage"), poemsEl = document.getElementById("poems"), qEl = document.getElementById("q");
const fmtDate = t => new Date(t).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const fold = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
/* entoure les passages trouvés, sans tenir compte des accents ni des majuscules */
function highlight(el, text, q){
  if (!q){ el.textContent = text; return; }
  const f = fold(text); let i = 0, k;
  while ((k = f.indexOf(q, i)) !== -1){
    el.append(text.slice(i, k));
    const m = document.createElement("mark"); m.textContent = text.slice(k, k + q.length); el.append(m);
    i = k + q.length;
  }
  el.append(text.slice(i));
}
function renderCarnet(){
  poemsEl.innerHTML = "";
  const q = fold(qEl.value.trim());
  const all = carnet.slice().reverse();
  const list = q ? all.filter(p => fold(poemText(p.words) + " " + (p.defi || "")).includes(q)) : all;
  document.getElementById("found").textContent = q ? (list.length ? `${list.length} poème${list.length > 1 ? "s" : ""}` : "") : "";
  if (!all.length){ poemsEl.innerHTML = '<p class="blank">Ton carnet est vide.<br>Compose un poème sur le frigo, puis touche « Garder ».</p>'; return; }
  if (!list.length){ poemsEl.innerHTML = '<p class="blank">Aucun poème avec ce mot.</p>'; return; }
  for (const p of list){
    const e = document.createElement("article"); e.className = "entry";
    if (p.defi){ const d = document.createElement("div"); d.className = "defi"; highlight(d, p.defi, q); e.append(d); }
    const pre = document.createElement("pre"); highlight(pre, poemText(p.words), q); e.append(pre);
    const meta = document.createElement("div"); meta.className = "meta";
    const d = document.createElement("span"); d.className = "d"; d.textContent = fmtDate(p.date);
    const reopen = document.createElement("button"); reopen.type = "button"; reopen.textContent = "↩ Sur le frigo";
    reopen.onclick = () => {
      words = [...words.filter(m => !m.on), ...p.words.map(w => mk(w.w, w.c || guessCat(w.w), {l: w.l || w.w, f: w.f || 0, on:true, x:w.x, y:w.y, r:w.r}))];
      lastSaved = snapshot();
      render(); save(); closeCarnet(); toast("Poème remis sur le frigo");
    };
    const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "Supprimer";
    del.onclick = () => {
      if (del.dataset.sure){ carnet = carnet.filter(x => x !== p); save(); render(); renderCarnet(); toast("Poème supprimé"); }
      else { del.dataset.sure = "1"; del.classList.add("sure"); del.textContent = "Sûre ?"; setTimeout(() => { if (del.isConnected){ delete del.dataset.sure; del.classList.remove("sure"); del.textContent = "Supprimer"; } }, 2500); }
    };
    meta.append(d, reopen, del); e.append(meta);
    poemsEl.append(e);
  }
}
qEl.addEventListener("input", renderCarnet);
function openCarnet(){ qEl.value = ""; renderCarnet(); carnetPage.hidden = false; carnetPage.querySelector(".scroll").scrollTop = 0; hideSaved(); }
function closeCarnet(){ carnetPage.hidden = true; qEl.blur(); }
document.getElementById("carnetBtn").onclick = openCarnet;
document.getElementById("carnetBack").onclick = closeCarnet;

/* ================= garder un poème, en douceur ================= */
const savedEl = document.getElementById("saved"); let savedT;
let lastSaved = null;
const snapshot = () => JSON.stringify(words.filter(m => m.on).map(m => [m.w, Math.round(m.x), Math.round(m.y)]).sort());
function hideSaved(){ savedEl.hidden = true; clearTimeout(savedT); }
document.getElementById("keep").onclick = () => {
  const on = words.filter(m => m.on);
  if (!on.length){ toast("Le frigo est vide pour l'instant"); return; }
  if (snapshot() === lastSaved){ toast("Ce poème est déjà dans ton carnet"); return; }
  const wasDefi = mode === "defi";
  carnet.push({date:Date.now(), pool, defi: wasDefi ? challenge : null,
    words:on.map(m => ({w:m.w, c:m.c, l:m.l, f:m.f, x:+m.x.toFixed(1), y:+m.y.toFixed(1), r:m.r}))});
  lastSaved = snapshot();
  if (wasDefi){ mode = "libre"; challenge = null; renderChallenge(); }
  save(); render();
  document.getElementById("savedTitle").textContent = wasDefi ? "Défi relevé, gardé dans ton carnet ✦" : "Gardé dans ton carnet 📓";
  door.classList.remove("kept"); void door.offsetWidth; door.classList.add("kept");
  savedEl.hidden = false; clearTimeout(savedT); savedT = setTimeout(hideSaved, 9000);
};
document.getElementById("savedRead").onclick = () => openCarnet();
document.getElementById("savedNew").onclick = () => { hideSaved(); openMenu("new"); };

/* ================= menu ================= */
const menu = document.getElementById("menu");
let menuClears = false;
function openMenu(kind){
  menuClears = kind !== "start";
  document.getElementById("menuTitle").textContent = kind === "new" ? "Un nouveau poème ?" : "Qu'est-ce qui te tente ?";
  document.getElementById("menuSub").textContent = kind === "start" ? "Tu pourras changer d'avis en cours de route." : "Le frigo sera vidé pour repartir de zéro.";
  document.getElementById("menuStay").textContent = kind === "start" ? "Juste regarder mon frigo" : "Annuler";
  menu.hidden = false;
}
function closeMenu(){ menu.hidden = true; }
function startFresh(){ if (menuClears){ words = words.filter(m => !m.on); lastSaved = null; hideSaved(); render(); } }
document.getElementById("pickFree").onclick = () => { startFresh(); setMode("libre"); closeMenu(); };
let lastStarter = null;
document.getElementById("pickStart").onclick = () => {
  words = words.filter(m => !m.on); lastSaved = null; hideSaved();
  let t; do { t = STARTERS[(Math.random()*STARTERS.length)|0]; } while (t === lastStarter && STARTERS.length > 1);
  lastStarter = t; putStarter(t); setMode("libre"); render(); save(); closeMenu();
};
document.getElementById("pickDefi").onclick = () => { startFresh(); challenge = newChallenge(); setMode("propose"); closeMenu(); };
document.getElementById("menuStay").onclick = () => closeMenu();
menu.addEventListener("click", e => { if (e.target === menu) document.getElementById("menuStay").click(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!menu.hidden) document.getElementById("menuStay").click(); else closeCarnet(); } });
document.getElementById("newBtn").onclick = () => openMenu("new");

/* ================= sachets et boutons ================= */
const poolsEl = document.getElementById("pools");
function renderPools(){
  poolsEl.innerHTML = "";
  const chip = k => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = POOL_NAMES[k];
    b.setAttribute("aria-pressed", k === pool);
    b.onclick = () => { pool = k; renderPools(); freshDrawer(); render(); drawer.scrollTop = 0; save(); };
    return b;
  };
  const sep = () => { const s = document.createElement("span"); s.className = "sep"; return s; };
  poolsEl.append(chip("tout"), sep(), ...AMBIANCES.map(chip), sep(), ...SAISONS.map(chip));
}
renderPools();
/* un sachet ajoute quelques mots au tiroir, sans enlever ceux qui y sont */
let newIds = new Set();
document.getElementById("shuffle").onclick = () => {
  const t = poolLists(pool);
  const have = c => new Set(words.filter(m => !m.on && m.c === c).map(m => m.l));
  const take = (list, c, n) => pick(list.filter(w => !have(c).has(w)), n).map(w => mk(w, c));
  const verbs = uniq([...t.verbes, ...COMMON_VERBS]);
  const fresh = [...take(t.noms, "nom", 4), ...take(verbs, "verbe", 2), ...take(t.adjs, "adj", 2)];
  if (!fresh.length){ toast("Tu as déjà tous les mots de cette ambiance"); return; }
  newIds = new Set(fresh.map(m => m.id));
  words = [...words.filter(m => m.on), ...fresh, ...words.filter(m => !m.on)];
  /* on montre l'onglet où il y a du nouveau */
  if (!fresh.some(m => m.c === tab)) tab = fresh[0].c;
  render(); drawer.scrollTop = 0; save();
  toast(`🎁 +${fresh.length} mot${fresh.length > 1 ? "s" : ""} dans ton tiroir`);
  setTimeout(() => { newIds = new Set(); }, 50);
};
document.getElementById("clearDoor").onclick = () => { words = words.filter(m => !m.on); lastSaved = null; hideSaved(); render(); save(); };

const toastEl = document.getElementById("toast"); let tt;
function toast(t){ toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("on"), 1500); }

/* pas de zoom sur téléphone : ni pincement, ni double-tape */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});

if (sampleLines){ putStarter(sampleLines); sampleLines = null; save(); }
render(); renderChallenge();
openMenu("start");
</script>
