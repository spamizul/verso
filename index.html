const pecheDuree = h => 12;
const pecheSt = () => S.peche || (S.peche = {});
function pecheTap(i){
  if (G[i] !== 'q' || O[i] || !(S.quaiTomas || []).includes(i)) return false;   // on ne pêche qu'au bout du petit quai de Tomas, sur son îlot
  if (momentWants('peche')){ pecheJouer(true); return true; }
  if (!pecheSt().on) return false;
  if (pecheSt().jour === S.jour){ hint('🎣 Les poissons se reposent… Reviens demain pêcher au filet !'); return true; }

function pecheJouer(histoire){
  if (document.getElementById('pecheBox')) return;

  box.innerHTML = `<div class="pe-app">
    <div class="pe-bulle"><canvas class="pe-face" width="16" height="16"></canvas><div class="pe-qui">Tomas</div><p class="pe-dit"></p><div class="pe-btns"><button type="button" class="pe-go"></button></div></div>

    <div class="pe-scene"><canvas class="pe-jeu"></canvas><div class="pe-mot"></div></div><button type="button" class="pe-fin" aria-label="Fermer">×</button></div>`;
  document.body.appendChild(box);

  const st = pecheSt();

  /* scène en gros pixels */

  const QUAI = () => LH - 16;
  const ESPECES = [{nom:'sardine', l:5, dos:'#3f6680', ventre:'#c9d8e4', poids:6}, {nom:'maquereau', l:6, dos:'#2f6b58', ventre:'#bfe0d0', raie:'#1d4438', poids:3}, {nom:'dorade', l:7, dos:'#c99a2e', ventre:'#f6dc8a', poids:1}];

  function garder(){   // les poissons attrapés vont au garde-manger

    if (histoire) st.histoire = Math.max(st.histoire || 0, prises);

  }
  function demarrer(){

  }

    const xs = t.map(p => p.x), ys = t.map(p => p.y), w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);

    if (pris){ crier(pris.sorte === 'tortue' ? 'Une tortue ! On relâche tout.' : 'Un hippocampe ! On relâche tout.');
      pris.v = (pris.x < LW / 2 ? -1 : 1) * 9; for (const f of poissons.filter(f => dedans(f, t))){ f.b.v = 16; f.b.cible = {x: f.x < LW / 2 ? -20 : LW + 20, y: f.y}; } filet = {poly: t, t0: performance.now(), gardes: []}; return; }
    const tous = poissons.filter(f => dedans(f, t)), dans = tous.filter(f => f.b.fond < 0.5);
    if (!dans.length && tous.length){ crier('Trop tard, ils ont plongé !'); return; }
    let gardes = dans;
    if (dans.length){
      const lache = aire(t) / (dans.length * 45);
      if (lache > 6) gardes = dans.slice(0, 1); else if (lache > 2.5) gardes = dans.slice(0, Math.ceil(dans.length / 2));
      const n = dans.length - gardes.length;
      crier(n ? 'Trop grand, ' + n + (n > 1 ? ' ont filé !' : ' a filé !') : gardes.some(f => f.e.nom === 'dorade') ? 'Une dorade !' : dans.length > 1 ? 'Joli coup !' : 'Un de plus !');
    } else crier('Raté !');

    st.on = 1; if (histoire){ st.essai = 1; save(); }   // la mission compte quand une partie a été jouée jusqu'au bout

    for (let y = 0; y < H; y++) px(0, y, LW, 1, y < H * 0.5 ? '#a9d6f2' : '#c4e3f4');
    px(LW - 26, H - 6, 22, 6, 'rgba(110,130,150,.22)'); px(LW - 22, H - 9, 8, 3, 'rgba(110,130,150,.2)'); px(LW - 19, H - 11, 3, 2, 'rgba(110,130,150,.18)');
    px(LW - 32, H - 10, 32, 10, 'rgba(240,246,250,.55)');
    px(0, H, LW, LH - H, '#4b93c9'); px(0, H, LW, 1, '#d8eef8');
    for (let k = 0; k < 40; k++){ const x = (k * 37 + Math.floor(t / 90) * (k % 3 ? 1 : 0)) % LW, y = H + 3 + (k * 13) % (LH - H - 4); px(x, y, 3, 1, 'rgba(255,255,255,.35)'); }
    px(0, E + 2, 26, LH - E, '#e2c98f'); px(26, E + 4, 5, LH - E, '#e2c98f'); px(31, E + 7, 4, LH - E, '#e2c98f'); px(0, E + 2, 26, 1, '#f2e2b8');
    for (let k = 0; k < 10; k++) px((k * 7) % 26, E + 5 + (k * 5) % 9, 1, 1, '#c9ad72');
    for (const [x, h] of [[2, 12], [7, 15], [12, 11]]){ px(x + 2, E - 1, 1, 3, '#5a3a22'); for (let i = 0; i < h; i += 3) px(x + 2 - Math.floor((h - i) / 5), E - 1 - i, 1 + 2 * Math.floor((h - i) / 5), 3, '#2e5a3e'); }
    const ex = 16, ey = E - 9;
    px(ex, ey, 4, 3, '#5a3a22'); px(ex, ey + 2, 4, 2, '#d8a07a'); px(ex, ey + 3, 4, 1, '#5a3a22');
    px(ex - 1, ey + 4, 6, 5, '#3f5a3a'); px(ex, ey + 9, 1, 3, '#2b2b30'); px(ex + 3, ey + 9, 1, 3, '#2b2b30'); px(ex + 5, ey + 5, 2, 1, '#3f5a3a');
    for (const r of ronds){ const a = (t - r.t) / 1400, w = Math.round(2 + a * 10 * r.r); px(r.x - w / 2, E + 1, w, 1, `rgba(255,255,255,${(1 - a) * 0.9})`); if (r.r > 2) px(r.x - 1, E - Math.round((1 - a) * 4), 2, Math.round((1 - a) * 4), `rgba(255,255,255,${(1 - a) * 0.8})`); }
    if (vol){ const l = vol.sauts[vol.k], f = vol.f || 0, x = vol.x0 + l * f, base = vol.k === 0 ? (E - 5) * (1 - f) + E * f : E, h = vol.k === 0 ? 5 : l * 0.32, y = base - Math.sin(Math.PI * f) * h; px(x - 1, y - 1, 3, 1, '#9a9da0'); px(x - 1, y, 3, 1, '#5d6064'); }
    else if (etat === 'jeu') px(ex + 7, ey + 4, 3, 1, '#9a9da0');
    if (trace && trace.length > 1){ cx.strokeStyle = 'rgba(255,255,255,.6)'; cx.lineWidth = Z; cx.beginPath(); cx.moveTo(trace[0].x * Z, trace[0].y * Z); for (const p of trace) cx.lineTo(p.x * Z, p.y * Z); cx.stroke(); }
  }
  requestAnimationFrame(() => { taille(); requestAnimationFrame(boucle); });
  window.addEventListener('resize', taille);
}

/* ---------- le démarrage : la page d'accueil, puis l'île ---------- */
function askName(done){
  sayQ = {lines:[], k:0}; const bu = $('bulle'); bu.classList.remove('mot'); bu.classList.add('liste');
  showBulle('carnet', {t:'Sur la couverture de ton carnet de bord, écris ton **prénom**. Et dessine-toi, juste en dessous !'}, {});
  const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 18; inp.placeholder = 'Ton prénom'; inp.autocomplete = 'off'; inp.className = 'nom';
  $('bExtra').innerHTML = ''; $('bExtra').append(inp, lookPicker(), $('bGo')); $('bGo').classList.add('fin'); $('bGo').textContent = 'C’est parti'; $('bGo').hidden = false;
  const go = () => { const v = inp.value.trim(); if (!v){ inp.focus(); return; } S.nom = v; sayQ = null; $('bExtra').innerHTML = ''; hideBulle(); bu.classList.remove('liste'); done(); };
  $('bGo').onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => inp.focus(), 80);
}
/* l'accueil : le titre, l'île au loin dans la brume, un bouton */
function accueil(texte, sous, go){
  document.body.classList.add('a-l-accueil');
  $('acGo').textContent = texte; $('acSous').textContent = sous || ''; $('accueil').hidden = false;
  $('acGo').onclick = () => { $('accueil').classList.add('part'); document.body.classList.remove('a-l-accueil'); setTimeout(() => { $('accueil').hidden = true; $('accueil').classList.remove('part'); }, 500); go(); };
}
function vueLarge(){ const P = CARTE.principale; zoom = Math.max(zoomMin(), Math.min(zoomMax(), board.width / (30*T))); lookAt(P.cx, P.cy - 2); }
function vueProche(cx, cy){ const z0 = zoom, z1 = Math.max(zoomMin(), Math.min(zoomMax(), (window.devicePixelRatio || 1) * 3.2)), t0 = performance.now();
  const step = () => { const k = Math.min(1, (performance.now() - t0) / 1200), e = k*k*(3 - 2*k); zoom = z0 + (z1 - z0)*e; lookAt(cx, cy); if (k < 1) requestAnimationFrame(step); }; step(); }
function newGame(){
  S = newState(); makeWorld(); startFog(); tday = 0.3; vueLarge();
  accueil('Commencer', '', () => showTraversee(accoster));
}
/* on accoste : la brume se lève sur la plage, ton personnage saute de la barque */
function accoster(){
  const f = S.fogs.find(x => x.key === 'start'); vueProche(f.cx, f.cy + 1); tday = 0.36;
  for (const x of S.fogs) if (x.key === 'arrivee'){ x.to = 0; x.sp = 0.5; }
  save();
  setTimeout(() => { player = playerSpawn(); forceDraw = true; }, 2300);
  setTimeout(() => sayList([B('carnet', 'Au petit matin, ta barque racle le sable d’une **île déserte**. Autour, la brume cache encore tout le reste.')], () => (S.nom ? (f => f()) : askName)(() => {
    S.started = true; save(); renderCard(true); renderBar(); renderRes(); setTimeout(momentTick, 300);
  })), 2600);
}
function boot(){
  resize();
  if (load() && S.started){
    villRegister(); sansBouee(); tracesRepare(); maisonGardien(); bateauxLibres(); if (S.moment && !MOMENTS.some(d => d.id === S.moment.id)) S.moment = null;   /* un chapitre retiré (le marché) : on le laisse tomber */ if (S.done.includes('lina')){ unlock('*', true); unlock('ƣ', true); } if (S.done.includes('tomas')) unlock('!', true); if (S.done.includes('falaises')) unlock('~', true); if (S.rPend == null && S.rVeut == null && S.done.includes('mer')) S.rVeut = 0; if (S.done.includes('tempete')) entrevoirPlaine(false); if (unlocked('c')){ if (!unlocked('g')) unlock('g', true); if (!unlocked('s')) unlock('s', true); } appliqueMeteo(); if (S.saison && SEASONS[S.saison]){ season = S.saison; PAL = SEASONS[season]; } gVer++; groundDirty = true; syncWalkers();
    vueLarge(); renderBar(); renderCard(true); renderRes();
    accueil('Continuer', `${tierName()} de ${S.nom} · ☀️ ${bonheur()}`, () => {
      const h = homeOf('toi') ?? homeOf('toi_c') ?? S.barque ?? 0, [x, y] = xy(h); vueProche(x, y);
      if (S.moment && !S.moment.read) setTimeout(startEtape, 1300);
    });
  } else newGame();
  renderBar(); requestAnimationFrame(frame);
}
addEventListener('pagehide', saveNow); document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
boot();
